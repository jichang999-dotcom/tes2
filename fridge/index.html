<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉장고">
<link rel="manifest" href="manifest.json">
<title>냉장고</title>
<style>
  body { margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); font-family: -apple-system, sans-serif; background: #fff; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  .shoot { display: block; padding: 14px; text-align: center; background: #007aff; color: #fff; border-radius: 10px; font-size: 17px; }
  .card { display: flex; gap: 12px; margin-top: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 10px; }
  .card.over { border-color: #c00; background: #fee; }
  .card img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; }
  .card div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  input[type=date], input[type=time] { font-size: 16px; padding: 4px; }
  .warn { color: #c00; font-weight: bold; }
  button { font-size: 15px; padding: 6px; border-radius: 6px; border: 1px solid #aaa; background: #f4f4f4; color: #000; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<h1>🧊 냉장고</h1>
<label class="shoot">📷 사진 찍어 넣기<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
<div id="list"></div>

<script type="module">
import { ics, today } from './logic.js';

navigator.storage?.persist?.();
const db = await new Promise((ok, no) => {
  const r = indexedDB.open('fridge', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => no(r.error);
});
const tx = (mode, fn) => new Promise((ok, no) => {
  const t = db.transaction('items', mode), r = fn(t.objectStore('items'));
  t.oncomplete = () => ok(r.result);
  t.onerror = () => no(t.error);
});

// 사진을 긴 변 800px JPEG로 줄여 저장 (원본 그대로면 저장공간이 금방 찬다)
async function shrink(file) {
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  const k = Math.min(1, 800 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: img.width * k, height: img.height * k });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.7));
}

// 1·2. 사진 찍기 → 찍은 날 = 입고날짜
cam.onchange = async () => {
  const file = cam.files[0];
  cam.value = '';
  if (!file) return;
  const photo = await shrink(file); // 트랜잭션 안에서 await 하면 트랜잭션이 닫히므로 먼저 줄인다
  await tx('readwrite', (s) => s.put({ id: String(Date.now()), photo, inDate: today(), exp: '' }));
  render();
};

async function render() {
  const items = await tx('readonly', (s) => s.getAll());
  // 유통기한 임박 순, 미입력은 맨 뒤
  items.sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999') || b.id - a.id);
  list.querySelectorAll('img').forEach((i) => URL.revokeObjectURL(i.src));
  list.replaceChildren(...items.map(card));
}

// 4. .ics 를 열면 아이폰이 「캘린더에 추가」 화면을 띄운다
function addToCalendar(text) {
  location.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
}

function card(item) {
  const over = item.exp && item.exp <= today();
  const el = document.createElement('section');
  el.className = 'card' + (over ? ' over' : '');
  el.innerHTML = `
    <img>
    <div>
      <span>입고 ${item.inDate}</span>
      <label>유통 마지막일 <input type="date" value="${item.exp}"></label>
      ${over ? '<span class="warn">⚠️ 오늘까지 / 지남</span>' : ''}
      <label>🔔 알림 시간 <input type="time" value="${item.time || '09:00'}"></label>
      <button>꺼냄(삭제)</button>
    </div>`;
  el.querySelector('img').src = URL.createObjectURL(item.photo);
  const [date, time] = el.querySelectorAll('input');

  // 날짜·시간을 저장하고 바로 캘린더에 등록 (같은 UID라 다시 등록하면 일정이 갱신됨)
  const commit = async (patch) => {
    const next = { ...item, time: time.value || '09:00', ...patch, seq: (item.seq || 0) + 1 };
    await tx('readwrite', (s) => s.put(next));
    if (next.exp) addToCalendar(ics(next.id, next.exp, next.inDate, next.time, next.seq));
    render();
  };

  // 3. 유통 마지막일: iOS는 빈 칸을 누르기만 해도 오늘 날짜를 채우므로
  //    값이 바뀌는 순간(change)이 아니라 선택창이 닫힐 때(blur) 판단한다
  let before;
  date.onfocus = () => (before = date.value);
  date.onblur = () => {
    const v = date.value;
    if (!before && v === today() && !confirm('유통 마지막일을 오늘로 등록할까요?')) return (date.value = '');
    if (v && v !== item.exp) commit({ exp: v });
  };
  time.onblur = () => time.value && time.value !== (item.time || '09:00') && commit({ time: time.value });
  el.querySelector('button').onclick = async () => {
    if (!confirm('꺼냈나요? 사진이 삭제됩니다.\n캘린더 일정은 캘린더 앱에서 따로 지워주세요.')) return;
    await tx('readwrite', (s) => s.delete(item.id));
    render();
  };
  return el;
}

render();
</script>
</body>
</html>
