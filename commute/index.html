<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#1b1d21; --sub:#6b7280; --line:#e4e6ea;
  --in:#1f7a4d; --in-bg:#e8f5ee; --out:#2f5fa8; --out-bg:#e9effa;
  --ok:#1f7a4d; --no:#b42318; --warn:#9a6700;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111317; --card:#1a1d22; --fg:#e8eaed; --sub:#9aa1ab; --line:#2a2e35;
    --in:#57c98d; --in-bg:#16281f; --out:#7aa7e8; --out-bg:#161f2c;
    --ok:#57c98d; --no:#f08b7f; --warn:#e0b34a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; align-items:flex-start;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
}
.wrap{width:100%; max-width:420px}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px}
.card + .card{margin-top:14px}
h1{font-size:19px; margin:0 0 4px; letter-spacing:-.2px}
.date{font-size:13px; color:var(--sub); margin:0}
.who{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.who .em{font-size:13px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.linkbtn{background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px; flex:none}

.status{display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px}
.slot{
  background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:13px 16px;
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; min-width:0;
}
.slot .k{font-size:13px; color:var(--sub); flex:none}
.slot .v{font-size:22px; font-weight:650; letter-spacing:-.5px; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slot.late .v{color:var(--no)}
.slot.late .k::after{content:' 지각'; color:var(--no); font-weight:600}

.btns{display:grid; gap:10px; margin-top:16px}
button.big{
  border:none; border-radius:14px; padding:18px; font-size:17px; font-weight:650;
  cursor:pointer; color:#fff; letter-spacing:-.2px; transition:transform .08s, opacity .15s;
}
button.big:active{transform:scale(.985)}
button.big:disabled{opacity:.45; cursor:default}
#btnIn{background:var(--in)}
#btnOut{background:var(--out)}

.loc{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); line-height:1.6}
.loc b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; background:var(--sub)}
.dot.ok{background:var(--ok)} .dot.no{background:var(--no)}
.coord{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:var(--sub); font-variant-numeric:tabular-nums}

.msg{margin-top:14px; border-radius:12px; padding:12px 14px; font-size:13.5px; line-height:1.55; display:none}
.msg.show{display:block}
.msg.ok{background:var(--in-bg); color:var(--ok)}
.msg.no{background:rgba(180,35,24,.1); color:var(--no)}
.msg.info{background:var(--out-bg); color:var(--out)}

.hint{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.55}
#gbtn{margin-top:18px; display:flex; justify-content:center; min-height:44px}
.hide{display:none !important}

.hist h2{font-size:15px; margin:0 0 10px}
.hist table{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.hist th,.hist td{padding:7px 4px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
.hist th{color:var(--sub); font-weight:500; font-size:12px}
.hist td.t,.hist th.t{text-align:right}
.hist tr.d td{background:var(--bg); color:var(--sub); font-size:12px; font-weight:600; padding:6px 8px}
.hist td.late{color:var(--no); font-weight:600}
.hist .nm{max-width:9em; overflow:hidden; text-overflow:ellipsis}
.spin{display:inline-block; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:r .7s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 로그인 -->
  <section id="viewLogin" class="card hide">
    <h1>출퇴근</h1>
    <p class="date">조직도에 등록된 구글 계정으로 로그인하세요.</p>
    <div id="gbtn"></div>
    <p class="hint" id="loginErr" style="color:var(--no)"></p>
    <p class="hint">위치 확인을 위해 브라우저가 위치 권한을 물어봅니다. 허용해야 출퇴근 처리가 됩니다.</p>
  </section>

  <!-- 2. 메인 -->
  <section id="viewMain" class="card hide">
    <h1>출퇴근</h1>
    <p class="date" id="today"></p>

    <div class="status" style="margin-top:16px">
      <div class="slot" id="slotIn"><div class="k">출근</div><div class="v" id="tIn">-</div></div>
      <div class="slot"><div class="k">퇴근</div><div class="v" id="tOut">-</div></div>
    </div>

    <div class="btns">
      <button class="big" id="btnIn">출근</button>
      <button class="big" id="btnOut">퇴근</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="loc">
      <div id="locLine"><span class="dot"></span>위치 확인 중</div>
      <div class="coord">
        <span id="coordTxt">-</span>
        <button class="linkbtn" id="btnCopy">복사</button>
        <button class="linkbtn" id="btnRefresh">위치 새로고침</button>
      </div>
    </div>

    <div class="who">
      <span class="em" id="meEm"></span>
      <button class="linkbtn" id="btnOutSess">로그아웃</button>
    </div>
    <p class="hint" id="mgrLine"></p>
  </section>

  <!-- 3. 기록 (전체권한 Y 는 전원, 나머지는 본인) -->
  <section id="viewHist" class="card hist hide">
    <h2 id="histTitle">내 출퇴근 기록</h2>
    <table><thead id="histHead"></thead><tbody id="histBody"></tbody></table>
    <p class="hint" id="histEmpty"></p>
  </section>

</div>

<script>
/* ===== 설정 ===== */
var API_URL   = 'https://script.google.com/macros/s/AKfycbw_pjt28WmUlXsI8K9l_T16exQIMR8dtE2dZCA-B6DJ6bNVJs7rzdJqA9qXF1BxmVGt/exec';
var CLIENT_ID = '977294712467-cpvocgvkm553kqfhqsgedhigh8ga2dut.apps.googleusercontent.com';
var OFFICE    = { lat: 37.47381, lng: 126.99494 };   // 남부순환로 2219 나노빌딩
var RADIUS_M  = 100;                                 // 서버에서 동일 값으로 재검증한다
/* ================ */

var token = null, me = null, pos = null;

var $ = function (id) { return document.getElementById(id); };
function show(v) {
  ['viewLogin', 'viewMain', 'viewHist'].forEach(function (n) { $(n).classList.add('hide'); });
  $(v).classList.remove('hide');
}
function say(el, kind, html) {
  el.className = 'msg show ' + kind;
  el.innerHTML = html;
}

/* 두 좌표 사이 거리(m). 서버 haversine_ 과 같은 식이어야 한다. */
function distM(aLat, aLng, bLat, bLng) {
  var R = 6371000, r = Math.PI / 180;
  var dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}
/* GPS 오차를 관용한 실효 거리. 실내 측위는 수십 m 씩 튄다. */
function effective(d, acc) { return Math.max(0, d - (acc || 0)); }

function api(body) {
  body.idToken = token;
  return fetch(API_URL, {
    method: 'POST',
    // text/plain 이라야 preflight 가 안 생긴다. Apps Script 는 OPTIONS 를 못 받는다.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

/* ---- 로그인 ----
 * 홈 화면 아이콘으로 실행하면(standalone) iOS 는 팝업을 띄울 수 없고 Safari 와 저장 공간도 분리된다.
 * 그래서 팝업을 쓰는 GIS 버튼이 accounts.google.com 백지로 끝난다.
 * standalone 에서는 같은 탭 리다이렉트로 id_token 을 받아온다.
 */
var standalone = window.navigator.standalone === true
  || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

function redirectLogin() {
  var a = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(a);
  var nonce = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  localStorage.setItem('nonce', nonce);   // 리다이렉트로 원점을 떠나므로 sessionStorage 는 못 믿는다

  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + [
    'client_id=' + encodeURIComponent(CLIENT_ID),
    'response_type=id_token',
    'scope=' + encodeURIComponent('openid email profile'),
    'redirect_uri=' + encodeURIComponent(location.origin + location.pathname),
    'nonce=' + nonce,
    'prompt=select_account'
  ].join('&');
}

/** 리다이렉트 복귀분. 토큰은 #fragment 로 온다. nonce 가 안 맞으면 버린다. */
function takeFragmentToken() {
  if (!location.hash || location.hash.indexOf('id_token=') < 0) return null;
  var t = null;
  location.hash.slice(1).split('&').forEach(function (kv) {
    var p = kv.split('=');
    if (p[0] === 'id_token') t = decodeURIComponent(p[1]);
  });
  history.replaceState(null, '', location.pathname);
  if (!t) return null;
  try {
    var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    if (JSON.parse(atob(b)).nonce !== localStorage.getItem('nonce')) return null;
  } catch (e) { return null; }
  localStorage.removeItem('nonce');
  return t;
}

window.onGoogleCredential = function (res) {
  token = res.credential;
  localStorage.setItem('idt', token);
  boot();
};

window.onload = function () {
  var fresh = takeFragmentToken();
  if (fresh) { token = fresh; localStorage.setItem('idt', token); }
  else token = localStorage.getItem('idt');

  if (standalone) {
    var b = document.createElement('button');
    b.className = 'big'; b.style.background = 'var(--out)'; b.style.width = '100%';
    b.textContent = '구글 계정으로 로그인';
    b.onclick = redirectLogin;
    $('gbtn').appendChild(b);
  } else {
    var waited = 0, iv = setInterval(function () {
      if (window.google && google.accounts) {
        clearInterval(iv);
        google.accounts.id.initialize({ client_id: CLIENT_ID, callback: window.onGoogleCredential, auto_select: true });
        google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko', width: 260 });
      } else if ((waited += 100) > 8000) {
        clearInterval(iv);
        $('gbtn').innerHTML = '';
        var f = document.createElement('button');
        f.className = 'big'; f.style.background = 'var(--out)'; f.style.width = '100%';
        f.textContent = '구글 계정으로 로그인';
        f.onclick = redirectLogin;
        $('gbtn').appendChild(f);
      }
    }, 100);
  }

  if (token) boot(); else show('viewLogin');
};

function boot() {
  api({ action: 'init' }).then(function (r) {
    if (r.error) {
      localStorage.removeItem('idt'); token = null;
      // 이유를 보여준다. 조직도 밖 계정이면 자동 로그인도 끈다(안 끄면 로그인-차단이 무한 반복된다)
      $('loginErr').textContent = r.error;
      if (/권한/.test(r.error) && window.google && google.accounts) google.accounts.id.disableAutoSelect();
      show('viewLogin');
      return;
    }
    $('loginErr').textContent = '';
    me = r.email;
    $('meEm').textContent = me;
    // 팀장은 시트 조직도 탭이 정한다. 팀장 본인이거나 팀장 없는 팀이면 cc 가 없다.
    var mg = r.managers || [];
    $('mgrLine').textContent = mg.length ? '지각 알림 수신: 본인, ' + mg.join(', ') : '';
    paint(r.today);
    show('viewMain');
    paintHist(r.history);
    locate();
  }).catch(function () {
    show('viewLogin');
    $('gbtn').insertAdjacentHTML('afterend', '<p class="hint" style="color:var(--no)">서버에 연결하지 못했습니다. API_URL 설정을 확인하세요.</p>');
  });
}

$('btnOutSess').onclick = function () {
  localStorage.removeItem('idt'); token = null;
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  show('viewLogin');
};

/* ---- 화면 갱신 ---- */
/* 서버가 'HH:mm' 만 준다. 그 형태가 아니면 표시하지 않는다 (시트를 손으로 고쳐 시간형이 된 옛 행 대비). */
function hhmm(v) { return /^\d{2}:\d{2}$/.test(String(v || '')) ? String(v) : '-'; }

function paint(t) {
  t = t || {};
  $('today').textContent = t.date || '';
  $('tIn').textContent = hhmm(t['in']);
  $('tOut').textContent = hhmm(t.out);
  $('slotIn').classList.toggle('late', !!t.late);
  $('btnIn').disabled = !!t['in'];
  $('btnIn').textContent = t['in'] ? '출근 완료' : '출근';
}

/* 기록 표. 날짜별로 묶어 최신 날짜가 위. 서버가 정렬·권한 필터를 해서 준다. */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function paintHist(h) {
  if (!h) return;   // 옛 백엔드는 history 를 안 준다
  $('histTitle').textContent = h.all ? '전체 출퇴근 기록' : '내 출퇴근 기록';
  $('histHead').innerHTML = '<tr>' + (h.all ? '<th>팀</th><th>이름</th>' : '<th></th>') + '<th class="t">출근</th><th class="t">퇴근</th></tr>';
  var html = '', last = '', cols = h.all ? 4 : 3;
  h.rows.forEach(function (r) {
    if (r.date !== last) { last = r.date; html += '<tr class="d"><td colspan="' + cols + '">' + esc(r.date) + '</td></tr>'; }
    html += '<tr>' + (h.all ? '<td>' + esc(r.team) + '</td><td class="nm">' + esc(r.name) + '</td>' : '<td></td>')
      + '<td class="t' + (r.late ? ' late' : '') + '">' + hhmm(r['in']) + (r.late ? ' 지각' : '') + '</td>'
      + '<td class="t">' + hhmm(r.out) + '</td></tr>';
  });
  $('histBody').innerHTML = html;
  $('histEmpty').textContent = h.rows.length ? '최근 30일' : '최근 30일 기록이 없습니다.';
  $('viewHist').classList.remove('hide');
}

/* ---- 위치 ---- */
function locate() {
  var line = $('locLine');
  line.innerHTML = '<span class="dot"></span><span class="spin"></span>위치 확인 중';
  if (!navigator.geolocation) { line.innerHTML = '<span class="dot no"></span>이 브라우저는 위치를 지원하지 않습니다'; return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    pos = p.coords;
    var d = distM(pos.latitude, pos.longitude, OFFICE.lat, OFFICE.lng);
    var eff = effective(d, pos.accuracy);
    var inside = eff <= RADIUS_M;
    line.innerHTML = '<span class="dot ' + (inside ? 'ok' : 'no') + '"></span>'
      + '회사까지 <b>' + Math.round(d) + 'm</b> · 오차 <b>±' + Math.round(pos.accuracy) + 'm</b>'
      + (inside ? ' · 허용 범위' : ' · 범위 밖 (' + RADIUS_M + 'm 기준)');
    $('coordTxt').textContent = pos.latitude.toFixed(6) + ', ' + pos.longitude.toFixed(6);
  }, function (err) {
    pos = null;
    line.innerHTML = '<span class="dot no"></span>위치를 가져오지 못했습니다 (' + (err.code === 1 ? '권한 거부' : err.code === 3 ? '시간 초과' : '사용 불가') + ')';
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
$('btnRefresh').onclick = locate;
$('btnCopy').onclick = function () {
  var t = $('coordTxt').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  this.textContent = '복사됨';
  var b = this; setTimeout(function () { b.textContent = '복사'; }, 1500);
};

/* ---- 출퇴근 ---- */
function punch(kind) {
  var m = $('msg'), label = kind === 'in' ? '출근' : '퇴근';
  if (!pos) { say(m, 'no', '위치를 먼저 확인하세요. 위치 새로고침을 누르고 다시 시도하세요.'); locate(); return; }
  $('btnIn').disabled = true; $('btnOut').disabled = true;
  say(m, 'info', '<span class="spin"></span>' + label + ' 처리 중');
  api({ action: kind, lat: pos.latitude, lng: pos.longitude, acc: pos.accuracy }).then(function (r) {
    $('btnOut').disabled = false;
    if (r.error) { say(m, 'no', r.error); $('btnIn').disabled = false; return; }
    paint(r.today);
    paintHist(r.history);
    if (r.already) say(m, 'info', '이미 ' + hhmm(r.today['in']) + ' 에 출근 처리되어 있습니다.');
    else say(m, 'ok', label + ' 완료 · ' + r.time + (r.late ? ' (지각)' : ''));
  }).catch(function () {
    $('btnIn').disabled = false; $('btnOut').disabled = false;
    say(m, 'no', '전송 실패. 네트워크를 확인하고 다시 시도하세요.');
  });
}
$('btnIn').onclick = function () { punch('in'); };
$('btnOut').onclick = function () { punch('out'); };

/* 화면을 다시 볼 때 서버 상태를 다시 받아온다.
 * 켜둔 채 자정을 넘기면 버튼이 어제 기준으로 잠긴 채 남는다. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && token && !$('viewMain').classList.contains('hide')) boot();
});
</script>
