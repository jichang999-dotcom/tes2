<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>와이맘 스페셜미션 현황</title><style>
:root{color-scheme:light;--c-main:#5B9BD5;--c-band:#D2DEEF;--c-band2:#EAEFF7;--c-text:#222;--c-sub:#666}
*{box-sizing:border-box;margin:0}
body{background:#f2f4f7;font-family:"Malgun Gothic","맑은 고딕",-apple-system,sans-serif;color:var(--c-text)}
.card{max-width:375px;min-height:100vh;margin:0 auto;background:#fff;border:2px solid var(--c-main)}
header{background:var(--c-main);color:#fff;text-align:center;padding:22px 12px 20px;font-weight:700}
header .s{font-size:14px;opacity:.95} header .t{font-size:22px;margin-top:6px}
.info{display:flex;gap:6px;padding:16px 12px}
.info div{flex:1;background:var(--c-main);color:#fff;text-align:center;padding:10px 2px;font-weight:700}
.info small{display:block;font-size:12px} .info b{display:block;font-size:14px;margin-top:4px;white-space:nowrap;letter-spacing:-.3px}
.meta{padding:0 16px 8px;font-size:12px;color:var(--c-sub);display:flex;justify-content:space-between}
table{width:calc(100% - 32px);margin:0 16px 24px;border-collapse:collapse;font-size:15px}
th{background:var(--c-main);color:#fff;padding:10px 8px;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid #fff;background:var(--c-band)}
tr:nth-child(even) td{background:var(--c-band2)}
td.n{text-align:center;font-weight:700;width:42%} td.empty{text-align:center;color:var(--c-sub);padding:28px 8px}
</style></head><body><div class="card">
<header><div class="s">[와이즈만] 입학테스트 프로모션</div><div class="t">와이맘 스페셜미션 현황 (2026.11)</div></header>
<div class="info"><div><small>집계 기간</small><b>~12/12(토)까지</b></div><div><small>결과 발표</small><b>12/15(화)</b></div><div><small>포상금 지급</small><b>1/8(금)</b></div></div>
<div class="meta"><span>11/12 신청분까지 반영(매일 8시 갱신)</span></div>
<table><thead><tr><th>소속 센터</th><th>신청 학생수(명)</th></tr></thead><tbody><tr><td colspan="2" class="empty">아직 신청한 학생이 없습니다</td></tr></tbody></table>
</div></body></html>
